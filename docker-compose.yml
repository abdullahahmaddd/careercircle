version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: career-backend
    ports:
      - "8002:8002"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app/backend:delegated

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: career-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
